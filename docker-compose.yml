services:
  redis:
    image: redis:7-alpine
    container_name: music-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-backend
    working_dir: /app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - C:\Users\Arxon.ARXONTAS\Music:/music
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      MUSIC_OUTPUT_BASE_DIR: /music-output
    depends_on:
      - redis

  frontend:
    build:
      context: ./music-ui
      dockerfile: Dockerfile
    container_name: music-frontend
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./music-ui:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - ./music-ui/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-celery
    working_dir: /app
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
      - C:\Users\Arxon.ARXONTAS\Music:/music
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
    depends_on:
      - redis
      - backend

volumes:
  frontend_node_modules:
